name: native-libs

# Current mode: manual dispatch.
# Automation (next step):
#   - release on tag push:  on: push: tags: ['native-libs-v*']  (version from tag)
#   - dev channel:          on: push: branches: [main]  (actions/upload-artifact)
on:
  workflow_dispatch:
    inputs:
      libs:
        description: "Libraries: sqlite,rocksdb-8.10.0 or all"
        type: string
        default: "all"
      publish_release:
        description: "Publish a GitHub Release (native-libs-v<release_version>)"
        type: boolean
        default: false
      release_version:
        description: "Release version"
        type: string
        default: "0.1.0"

permissions:
  contents: write

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: set
        env:
          LIBS: ${{ inputs.libs }}
        run: |
          MATRIX=$(python3 scripts/build_matrix.py --libs "$LIBS")
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"

  build:
    needs: filter
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.filter.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Only the fixture is a Cargo workspace; pointing rust-cache at it
          # avoids `cargo metadata` failing at the repo root (no Cargo.toml).
          workspaces: tests/consumer-fixture

      - name: Build & package
        id: build
        shell: bash
        env:
          RECIPE_LIB: ${{ matrix.lib }}
          TRIPLE: ${{ matrix.triple }}
          OUTDIR: ${{ runner.temp }}/out
        run: |
          PYTHON="$(command -v python3 || command -v python)"
          mkdir -p "$OUTDIR"
          "$PYTHON" "recipes/$RECIPE_LIB.py" --triple "$TRIPLE" --out "$OUTDIR"

      - name: Validate manifest & sha256
        shell: bash
        env:
          OUTDIR: ${{ runner.temp }}/out
        run: |
          PYTHON="$(command -v python3 || command -v python)"
          "$PYTHON" scripts/check_manifest.py --zip "$OUTDIR"/native-libs-*.zip

      - name: Upload artifact (dev channel)
        uses: actions/upload-artifact@v4
        with:
          name: native-libs-${{ matrix.lib }}-${{ matrix.triple }}
          path: ${{ runner.temp }}/out/native-libs-*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Verify consumer fixture
        shell: bash
        env:
          RECIPE_LIB: ${{ matrix.lib }}
          TRIPLE: ${{ matrix.triple }}
          OUTDIR: ${{ runner.temp }}/out
        run: |
          PYTHON="$(command -v python3 || command -v python)"
          "$PYTHON" "recipes/$RECIPE_LIB.py" --verify --triple "$TRIPLE" --out "$OUTDIR"

  publish-release:
    if: inputs.publish_release == true
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect + SHA256SUMS
        shell: bash
        run: |
          mkdir -p release
          cp artifacts/native-libs-*.zip release/
          (cd release && sha256sum *.zip > SHA256SUMS.txt)

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: native-libs-v${{ inputs.release_version }}
        run: |
          REPO="vkozio/prebuilt-native-libs"
          if gh release view "$RELEASE_TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/native-libs-*.zip release/SHA256SUMS.txt --repo "$REPO" --clobber
          else
            gh release create "$RELEASE_TAG" release/native-libs-*.zip release/SHA256SUMS.txt \
              --repo "$REPO" \
              --title "native-libs ${{ inputs.release_version }}" \
              --notes "Prebuilt native libraries: ${{ inputs.libs }}"
          fi
